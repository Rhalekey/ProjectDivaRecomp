# Edition "recommended": the project's own choices on top of the game.

renderer = gl
render_scale = 3
present_filter = linear
# Smooth text, from the free font in fonts\, or from one of your own if you put it in
# %LOCALAPPDATA%\ProjectDivaRecomp\fonts.
hd_textures = 1

# Midway through the frame. This is what gives songs a steady 60 fps.
vblank_interrupt_offset_us = 8000

save_messages = 1
mods = 1

translations = 1
# 1 asks the language on every start. 0 asks only if no choice has been saved.
language_prompt = 1

# More rows in the game's Options window: language, song names and lyrics in romaji, the
# question above, the frame rate.
# What you choose there is kept with your saves and wins over language_prompt here.
extras = 1
