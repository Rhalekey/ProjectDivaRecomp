# Edition "raw": the game as close to the original as this project can make it.
# Nothing added, nothing replaced.

renderer = gl
render_scale = 1
present_filter = nearest
hd_textures = 0

# The interrupt on the refresh itself. The game then runs songs at about 30 fps.
# Whether that is what a real PSP does has not been checked against one.
vblank_interrupt_offset_us = 0

save_messages = 0
mods = 0

translations = 0
# 1 asks the language on every start. 0 asks only if no choice has been saved.
language_prompt = 0

extras = 0
